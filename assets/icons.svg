<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Shared SVG sprite. Use from HTML as:
         <svg class="icon" width="18" height="18"><use href="/assets/icons.svg#icon-globe"/></svg>
       Always set width/height attributes on the <svg> so the icon has a sane size even before CSS loads. -->

  <!-- UI icons (Lucide-style, 24×24, stroke = currentColor) -->
  <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
    <path d="M2 12h20"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5"/>
  </symbol>
</svg>
